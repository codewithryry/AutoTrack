name: Android release APK

# Builds the web app, wraps it with Capacitor, and produces a signed release APK.
#
# Nothing secret lives in this repository. The keystore arrives as a base64
# secret, is decoded to a file outside the workspace, and is removed again when
# the job ends. Every value that touches it is passed through the environment,
# never interpolated into a command line — an `${{ secrets.* }}` inside a `run:`
# would be substituted into the shell before it executes, and would then be
# visible in a trace or a crash message.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # Capacitor's CLI requires Node >= 22.
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      # Pinned to v3.2.2 and told exactly which packages to install.
      #
      # Left to itself the action resolves a default package set that still
      # includes `tools` — the obsolete SDK Tools bundle, which Google removed
      # from the repository. `sdkmanager` cannot find it and exits 1, which is
      # the failure this pins away from. `log-accepted-android-sdk-licenses` is
      # off so the licence hashes stay out of the build log.
      - uses: android-actions/setup-android@v3.2.2
        with:
          packages: ""
          log-accepted-android-sdk-licenses: false

      # Only what this project actually builds against, read from the Gradle
      # configuration rather than assumed:
      #   • compileSdk/targetSdk 36 → android/variables.gradle
      #   • build-tools 36.0.0      → the version AGP 8.13.0 defaults to
      #   • platform-tools          → adb and friends, needed by the toolchain
      # `--sdk_root` keeps the packages in the SDK the action just provisioned.
      - name: Install the Android SDK packages
        run: |
          sdkmanager --sdk_root="$ANDROID_SDK_ROOT" \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0"

      - name: Install dependencies
        run: npm ci

      - name: Build the web app for the native shell
        env:
          # Every client-side variable the application actually reads, and
          # nothing else. All four are compiled into the bundle, so all four are
          # public by definition — an APK can be unzipped. That is fine for what
          # is here and is why the server-only values are absent:
          # COHERE_API_KEY, VAPID_PRIVATE_KEY, VAPID_SUBJECT and
          # SUPABASE_SERVICE_ROLE_KEY belong to `api/*` on the deployment and
          # must never be given a VITE_ name or reach this build.
          #
          # Required — src/supabase/config.js throws without them. The
          # publishable (anon) key authorises nothing on its own; Row Level
          # Security is what protects the data.
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
          # Optional — the public half of the VAPID pair, read by
          # src/services/push.js. Unset, `isAvailable()` is false and the app
          # simply runs without push, so a missing secret must not fail the
          # build. The private half (VAPID_PRIVATE_KEY) stays on the server.
          #
          # `||` supplies an empty string when the secret does not exist, which
          # is also what stops an editor warning on a repository that has not
          # defined it. Set the secret to switch push on in the APK:
          #   gh secret set VITE_VAPID_PUBLIC_KEY --repo codewithryry/AutoTrack
          # VITE_VAPID_PUBLIC_KEY: ${{ secrets.VITE_VAPID_PUBLIC_KEY || '' }}
          # Where the deployed web app lives, so the APK can reach the app's own
          # /api/* endpoints — in the WebView a relative path would resolve
          # against the shell's own origin, which serves nothing. A fixed
          # deployment address rather than a repository variable: it is not a
          # secret, and a missing variable would silently produce an APK whose
          # /api/* calls go nowhere.
          VITE_PUBLIC_APP_URL: https://autotracking.vercel.app
          #
          # VITE_SIGNUP_EMAIL_DOMAINS is deliberately not set here. It is an
          # optional allowlist and is empty in .env; unset, sign-up accepts any
          # address, which is the behaviour this project runs with. Leaving it
          # out keeps the build from depending on a repository variable that
          # does not need to exist.
        run: npm run build:android

      - name: Sync the native project
        run: npx cap sync android

      - name: Decode the keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "ANDROID_KEYSTORE_BASE64 is not set — cannot produce a signed APK." >&2
            exit 1
          fi
          # Outside the workspace, so it can never be picked up by a later step
          # that archives or uploads the checkout.
          mkdir -p "$RUNNER_TEMP/signing"
          # `tr -d` strips the whitespace and newlines the GitHub secrets box
          # adds to a pasted value; without it `base64 -d` can refuse the input
          # or write a truncated keystore. The keystore is binary and is never
          # echoed.
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | tr -d '\r\n \t' | base64 -d > "$RUNNER_TEMP/signing/release.jks"

          if [ ! -s "$RUNNER_TEMP/signing/release.jks" ]; then
            echo "The decoded keystore is empty — ANDROID_KEYSTORE_BASE64 is not valid base64." >&2
            exit 1
          fi
          echo "Keystore decoded ($(stat -c%s "$RUNNER_TEMP/signing/release.jks") bytes)."

      # Checks the shape of the credentials before Gradle gets them, so a bad
      # secret is reported in one clear line instead of surfacing as
      # "Get Key failed: getSecretKey failed: Password is not ASCII" from deep
      # inside :app:packageRelease.
      #
      # Nothing here prints a value: only lengths, yes/no answers and the name of
      # the offending variable reach the log.
      - name: Validate the signing credentials
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          fail=0

          check() {
            name="$1"
            value="$2"

            if [ -z "$value" ]; then
              echo "FAIL  $name is empty or not set."
              fail=1
              return
            fi

            # Raw byte length against the length with CR/LF/tab removed. A
            # mismatch is the usual cause of this failure: a value pasted into
            # the secrets box with a trailing newline.
            raw=$(printf '%s' "$value" | wc -c)
            trimmed=$(printf '%s' "$value" | tr -d '\r\n\t' | wc -c)
            if [ "$raw" -ne "$trimmed" ]; then
              echo "FAIL  $name contains a line break or tab."
              echo "      Re-enter the secret with no trailing newline."
              fail=1
              return
            fi

            if printf '%s' "$value" | grep -qE '^[[:space:]]|[[:space:]]$'; then
              echo "FAIL  $name has leading or trailing whitespace."
              fail=1
              return
            fi

            # The actual error being fixed: Java's keystore loader accepts ASCII
            # only. This catches smart quotes pasted from a document, accented
            # characters, and any other non-ASCII byte.
            if LC_ALL=C printf '%s' "$value" | grep -q '[^ -~]'; then
              echo "FAIL  $name contains a non-ASCII or control character."
              echo "      Retype it by hand rather than pasting from a document."
              fail=1
              return
            fi

            # A password that is really the base64 keystore in the wrong box. The
            # keystore is thousands of characters, so length alone is a reliable
            # and non-revealing signal.
            if [ "$raw" -gt 256 ]; then
              echo "FAIL  $name is too long for a password or alias."
              echo "      Check it is not the ANDROID_KEYSTORE_BASE64 value."
              fail=1
              return
            fi

            echo "ok    $name is present and ASCII."
          }

          check ANDROID_KEYSTORE_PASSWORD "$ANDROID_KEYSTORE_PASSWORD"
          check ANDROID_KEY_ALIAS         "$ANDROID_KEY_ALIAS"
          check ANDROID_KEY_PASSWORD      "$ANDROID_KEY_PASSWORD"

          if [ "$fail" -ne 0 ]; then
            echo "" >&2
            echo "One or more signing secrets are malformed. Fix them under" >&2
            echo "Settings -> Secrets and variables -> Actions, then re-run." >&2
            exit 1
          fi
          echo "All signing credentials are well-formed."

      # Proves the keystore, its password and the alias actually agree, before a
      # full Gradle build is spent finding out. `keytool -list` exits non-zero on
      # a wrong password or a missing alias; its output is discarded so no
      # certificate detail reaches the log.
      - name: Verify the keystore opens with these credentials
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          if keytool -list \
              -keystore "$RUNNER_TEMP/signing/release.jks" \
              -storepass "$ANDROID_KEYSTORE_PASSWORD" \
              -alias "$ANDROID_KEY_ALIAS" >/dev/null 2>&1; then
            echo "The keystore opens and contains the expected alias."
          else
            echo "The keystore could not be opened with ANDROID_KEYSTORE_PASSWORD," >&2
            echo "or it does not contain the alias named by ANDROID_KEY_ALIAS." >&2
            echo "This keystore was generated with the alias 'android'." >&2
            exit 1
          fi

      - name: Build the signed release APK
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/signing/release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        working-directory: android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Verify the APK is signed
        run: |
          APK=android/app/build/outputs/apk/release/app-release.apk
          if [ ! -f "$APK" ]; then
            echo "No APK was produced at $APK" >&2
            exit 1
          fi

          # apksigner ships with the build-tools; find the newest copy.
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1)"
          if [ -z "$APKSIGNER" ]; then
            echo "apksigner was not found in the Android SDK." >&2
            exit 1
          fi

          # The real check: this fails the job on an unsigned or badly signed APK
          # rather than shipping one. `--verbose` prints the scheme versions and
          # the certificate digests, none of which are secret.
          "$APKSIGNER" verify --verbose --print-certs "$APK"
          echo "APK signature verified."

      - name: Upload the APK
        uses: actions/upload-artifact@v4
        with:
          name: tooltrack-release-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

      - name: Remove the keystore
        if: always()
        run: rm -rf "$RUNNER_TEMP/signing"
