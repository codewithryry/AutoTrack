name: Android release APK

# Builds the web app, wraps it with Capacitor, and produces a signed release APK.
#
# Nothing secret lives in this repository. The keystore arrives as a base64
# secret, is decoded to a file outside the workspace, and is removed again when
# the job ends. Every value that touches it is passed through the environment,
# never interpolated into a command line — an `${{ secrets.* }}` inside a `run:`
# would be substituted into the shell before it executes, and would then be
# visible in a trace or a crash message.

# A release is cut by pushing a version tag, not by pushing to main:
#
#   git tag 0.2.2 && git push origin 0.2.2      # or v0.2.2
#
# Both spellings are matched. `v*` alone would have missed the `0.2.1` tag that
# this repository actually uses, and a tag that matches no pattern does not fail
# — it simply never runs, which is how a Release came to exist with no APK
# attached to it.
#
# main and pull requests still build and sign, so breakage is found before a tag
# is cut — but they publish nothing. Only a version tag touches a Release.
on:
  push:
    branches: [main]
    tags:
      - '[0-9]+.[0-9]+.[0-9]+*'
      - 'v[0-9]+.[0-9]+.[0-9]+*'
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to build and attach the APK to (e.g. 0.2.5)'
        required: false
        type: string

# The Release step needs to write to the repository; nothing else does. Declared
# here so the job's token carries no more authority than the one step requires.
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          # Auto-generated release notes are written from the commits since the
          # previous tag, which the default shallow clone does not contain.
          fetch-depth: 0

      # Establishes, once, whether this run is a release, and refuses a tag that
      # disagrees with the version the APK will report.
      #
      # `versionName` in the APK comes from the project, not from the tag, so a
      # v0.3.0 tag cut while package.json still says 0.2.1 would publish a
      # release whose APK calls itself something else. Catching that here costs a
      # second; catching it after the APK is in someone's hands does not.
      - name: Resolve the release version
        id: release
        env:
          # A tag given by hand, to attach an APK to a Release that already
          # exists without cutting a new tag for it.
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            tag="$GITHUB_REF_NAME"
          elif [ -n "$INPUT_TAG" ]; then
            tag="$INPUT_TAG"
            # A hand-typed tag has to exist, or the Release step would create an
            # empty one under a name nobody meant.
            if ! git rev-parse -q --verify "refs/tags/${tag}" >/dev/null; then
              echo "The tag ${tag} does not exist in this repository." >&2
              exit 1
            fi
          else
            tag=""
          fi

          if [ -n "$tag" ]; then
            # Both `0.2.1` and `v0.2.1` are accepted; the leading v is optional
            # and is stripped for the comparison either way.
            version="${tag#v}"
            # Read with sed rather than node: this step runs before setup-node,
            # and the version is the first "version" key at the top level.
            package="$(sed -n 's/^  "version": "\(.*\)",$/\1/p' package.json | head -1)"

            if [ "$version" != "$package" ]; then
              echo "The tag ${tag} does not match the version in package.json (${package})." >&2
              echo "Set the version in package.json to ${version}, or tag ${package}." >&2
              exit 1
            fi

            echo "is_release=true" >> "$GITHUB_OUTPUT"
            echo "tag=${tag}" >> "$GITHUB_OUTPUT"
            echo "version=${version}" >> "$GITHUB_OUTPUT"
            echo "Building release ${tag}."
          else
            echo "is_release=false" >> "$GITHUB_OUTPUT"
            echo "Not a tag — building for verification only; nothing will be published."
          fi

      # Capacitor's CLI requires Node >= 22.
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      # Pinned to v3.2.2 and told exactly which packages to install.
      #
      # Left to itself the action resolves a default package set that still
      # includes `tools` — the obsolete SDK Tools bundle, which Google removed
      # from the repository. `sdkmanager` cannot find it and exits 1, which is
      # the failure this pins away from. `log-accepted-android-sdk-licenses` is
      # off so the licence hashes stay out of the build log.
      - uses: android-actions/setup-android@v3.2.2
        with:
          packages: ""
          log-accepted-android-sdk-licenses: false

      # Only what this project actually builds against, read from the Gradle
      # configuration rather than assumed:
      #   • compileSdk/targetSdk 36 → android/variables.gradle
      #   • build-tools 36.0.0      → the version AGP 8.13.0 defaults to
      #   • platform-tools          → adb and friends, needed by the toolchain
      # `--sdk_root` keeps the packages in the SDK the action just provisioned.
      - name: Install the Android SDK packages
        run: |
          sdkmanager --sdk_root="$ANDROID_SDK_ROOT" \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0"

      - name: Install dependencies
        run: npm ci

      - name: Build the web app for the native shell
        env:
          # Every client-side variable the application actually reads, and
          # nothing else. All four are compiled into the bundle, so all four are
          # public by definition — an APK can be unzipped. That is fine for what
          # is here and is why the server-only values are absent:
          # COHERE_API_KEY, VAPID_PRIVATE_KEY, VAPID_SUBJECT and
          # SUPABASE_SERVICE_ROLE_KEY belong to `api/*` on the deployment and
          # must never be given a VITE_ name or reach this build.
          #
          # Required — src/supabase/config.js throws without them. The
          # publishable (anon) key authorises nothing on its own; Row Level
          # Security is what protects the data.
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
          # Optional — the public half of the VAPID pair, read by
          # src/services/push.js. Unset, `isAvailable()` is false and the app
          # simply runs without push, so a missing secret must not fail the
          # build. The private half (VAPID_PRIVATE_KEY) stays on the server.
          #
          # `||` supplies an empty string when the secret does not exist, which
          # is also what stops an editor warning on a repository that has not
          # defined it. Set the secret to switch push on in the APK:
          #   gh secret set VITE_VAPID_PUBLIC_KEY --repo codewithryry/AutoTrack
          # VITE_VAPID_PUBLIC_KEY: ${{ secrets.VITE_VAPID_PUBLIC_KEY || '' }}
          # Where the deployed web app lives, so the APK can reach the app's own
          # /api/* endpoints — in the WebView a relative path would resolve
          # against the shell's own origin, which serves nothing. A fixed
          # deployment address rather than a repository variable: it is not a
          # secret, and a missing variable would silently produce an APK whose
          # /api/* calls go nowhere.
          VITE_PUBLIC_APP_URL: https://autotracking.vercel.app
          #
          # VITE_SIGNUP_EMAIL_DOMAINS is deliberately not set here. It is an
          # optional allowlist and is empty in .env; unset, sign-up accepts any
          # address, which is the behaviour this project runs with. Leaving it
          # out keeps the build from depending on a repository variable that
          # does not need to exist.
        run: npm run build:android

      - name: Sync the native project
        run: npx cap sync android

      - name: Decode the keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "ANDROID_KEYSTORE_BASE64 is not set — cannot produce a signed APK." >&2
            exit 1
          fi
          # Outside the workspace, so it can never be picked up by a later step
          # that archives or uploads the checkout.
          mkdir -p "$RUNNER_TEMP/signing"
          # `tr -d` strips the whitespace and newlines the GitHub secrets box
          # adds to a pasted value; without it `base64 -d` can refuse the input
          # or write a truncated keystore. The keystore is binary and is never
          # echoed.
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | tr -d '\r\n \t' | base64 -d > "$RUNNER_TEMP/signing/release.jks"

          if [ ! -s "$RUNNER_TEMP/signing/release.jks" ]; then
            echo "The decoded keystore is empty — ANDROID_KEYSTORE_BASE64 is not valid base64." >&2
            exit 1
          fi
          echo "Keystore decoded ($(stat -c%s "$RUNNER_TEMP/signing/release.jks") bytes)."

      # Checks the shape of the credentials before Gradle gets them, so a bad
      # secret is reported in one clear line instead of surfacing as
      # "Get Key failed: getSecretKey failed: Password is not ASCII" from deep
      # inside :app:packageRelease.
      #
      # Nothing here prints a value: only lengths, yes/no answers and the name of
      # the offending variable reach the log.
      - name: Validate the signing credentials
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          fail=0

          check() {
            name="$1"
            value="$2"

            if [ -z "$value" ]; then
              echo "FAIL  $name is empty or not set."
              fail=1
              return
            fi

            # Raw byte length against the length with CR/LF/tab removed. A
            # mismatch is the usual cause of this failure: a value pasted into
            # the secrets box with a trailing newline.
            raw=$(printf '%s' "$value" | wc -c)
            trimmed=$(printf '%s' "$value" | tr -d '\r\n\t' | wc -c)
            if [ "$raw" -ne "$trimmed" ]; then
              echo "FAIL  $name contains a line break or tab."
              echo "      Re-enter the secret with no trailing newline."
              fail=1
              return
            fi

            if printf '%s' "$value" | grep -qE '^[[:space:]]|[[:space:]]$'; then
              echo "FAIL  $name has leading or trailing whitespace."
              fail=1
              return
            fi

            # The actual error being fixed: Java's keystore loader accepts ASCII
            # only. This catches smart quotes pasted from a document, accented
            # characters, and any other non-ASCII byte.
            if LC_ALL=C printf '%s' "$value" | grep -q '[^ -~]'; then
              echo "FAIL  $name contains a non-ASCII or control character."
              echo "      Retype it by hand rather than pasting from a document."
              fail=1
              return
            fi

            # A password that is really the base64 keystore in the wrong box. The
            # keystore is thousands of characters, so length alone is a reliable
            # and non-revealing signal.
            if [ "$raw" -gt 256 ]; then
              echo "FAIL  $name is too long for a password or alias."
              echo "      Check it is not the ANDROID_KEYSTORE_BASE64 value."
              fail=1
              return
            fi

            echo "ok    $name is present and ASCII."
          }

          check ANDROID_KEYSTORE_PASSWORD "$ANDROID_KEYSTORE_PASSWORD"
          check ANDROID_KEY_ALIAS         "$ANDROID_KEY_ALIAS"
          check ANDROID_KEY_PASSWORD      "$ANDROID_KEY_PASSWORD"

          if [ "$fail" -ne 0 ]; then
            echo "" >&2
            echo "One or more signing secrets are malformed. Fix them under" >&2
            echo "Settings -> Secrets and variables -> Actions, then re-run." >&2
            exit 1
          fi
          echo "All signing credentials are well-formed."

      # Proves the keystore, its password and the alias actually agree, before a
      # full Gradle build is spent finding out. `keytool -list` exits non-zero on
      # a wrong password or a missing alias; its output is discarded so no
      # certificate detail reaches the log.
      - name: Verify the keystore opens with these credentials
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          if keytool -list \
              -keystore "$RUNNER_TEMP/signing/release.jks" \
              -storepass "$ANDROID_KEYSTORE_PASSWORD" \
              -alias "$ANDROID_KEY_ALIAS" >/dev/null 2>&1; then
            echo "The keystore opens and contains the expected alias."
          else
            echo "The keystore could not be opened with ANDROID_KEYSTORE_PASSWORD," >&2
            echo "or it does not contain the alias named by ANDROID_KEY_ALIAS." >&2
            echo "This keystore was generated with the alias 'android'." >&2
            exit 1
          fi

      - name: Build the signed release APK
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/signing/release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        working-directory: android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Verify the APK is signed
        run: |
          APK=android/app/build/outputs/apk/release/app-release.apk
          if [ ! -f "$APK" ]; then
            echo "No APK was produced at $APK" >&2
            exit 1
          fi

          # apksigner ships with the build-tools; find the newest copy.
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1)"
          if [ -z "$APKSIGNER" ]; then
            echo "apksigner was not found in the Android SDK." >&2
            exit 1
          fi

          # The real check: this fails the job on an unsigned or badly signed APK
          # rather than shipping one. `--verbose` prints the scheme versions and
          # the certificate digests, none of which are secret.
          "$APKSIGNER" verify --verbose --print-certs "$APK"
          echo "APK signature verified."

      # What the APK actually asks the device for, read back out of the built
      # APK rather than from the manifest source - the manifest merger folds in
      # every library's manifest, so the source file is not the final answer.
      #
      # The list is pinned: a plugin update that starts merging in a new
      # permission fails the build here instead of being discovered by a user
      # seeing a Play Protect warning. To add one deliberately, add it to
      # EXPECTED below and say why in the app manifest.
      - name: Verify the APK requests only the expected permissions
        run: |
          APK=android/app/build/outputs/apk/release/app-release.apk
          AAPT="$(find "$ANDROID_HOME/build-tools" -name aapt2 -type f | sort -V | tail -1)"

          cat > /tmp/expected-permissions <<'PERMS'
          android.permission.ACCESS_COARSE_LOCATION
          android.permission.ACCESS_FINE_LOCATION
          android.permission.CAMERA
          android.permission.INTERNET
          android.permission.POST_NOTIFICATIONS
          PERMS
          sed -i 's/^[[:space:]]*//' /tmp/expected-permissions
          sort -u -o /tmp/expected-permissions /tmp/expected-permissions

          "$AAPT" dump permissions "$APK" \
            | sed -n "s/^uses-permission: name='\([^']*\)'.*/\1/p" \
            | sort -u > /tmp/actual-permissions

          echo "Permissions in the APK:"
          sed 's/^/  /' /tmp/actual-permissions

          if ! diff /tmp/expected-permissions /tmp/actual-permissions >/dev/null; then
            echo "" >&2
            echo "The APK's permissions differ from the expected set." >&2
            diff /tmp/expected-permissions /tmp/actual-permissions >&2 || true
            echo "" >&2
            echo "A line marked > is newly requested - usually merged in by a" >&2
            echo "plugin. Remove it with tools:node=\"remove\" in the app" >&2
            echo "manifest, or add it to EXPECTED here if it is really needed." >&2
            exit 1
          fi
          echo "Permissions match the expected set."

      # A release APK must never be debuggable: it opens the running app to any
      # process on the device, and it is one of the things a scanner looks at.
      - name: Verify the APK is a release build
        run: |
          APK=android/app/build/outputs/apk/release/app-release.apk
          AAPT="$(find "$ANDROID_HOME/build-tools" -name aapt2 -type f | sort -V | tail -1)"
          if "$AAPT" dump badging "$APK" | grep -q "application-debuggable"; then
            echo "This APK is debuggable - refusing to publish it." >&2
            exit 1
          fi
          echo "Not debuggable."

      # Named for the build it came from, so a downloaded APK is identifiable
      # rather than being one more `app-release.apk` in a downloads folder.
      - name: Name the APK
        id: apk
        run: |
          if [ "${{ steps.release.outputs.is_release }}" = "true" ]; then
            name="tooltrack-${{ steps.release.outputs.tag }}.apk"
          else
            name="tooltrack-${GITHUB_SHA:0:7}.apk"
          fi
          cp android/app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/$name"
          echo "path=$RUNNER_TEMP/$name" >> "$GITHUB_OUTPUT"
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "Prepared $name"

      # Every run keeps the APK as a build artifact, tagged or not — that is what
      # makes a main-branch run useful without publishing anything.
      - name: Upload the APK as a build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.apk.outputs.name }}
          path: ${{ steps.apk.outputs.path }}
          if-no-files-found: error

      # Attaches the signed APK to the Release for this tag, creating that
      # Release only if it does not already exist.
      #
      # A push to main reaches this step and skips it, so main is still verified
      # end to end without ever touching a Release.
      #
      # `gh` rather than a third-party action, because the requirement is
      # precisely "upload to the release that is already there": `gh release
      # view` answers whether it exists, `gh release upload --clobber` adds or
      # replaces the asset without disturbing the notes somebody may have
      # written, and `gh release create` is reached only for a tag that has no
      # Release yet. No duplicate Release is possible.
      - name: Attach the APK to the GitHub Release
        if: steps.release.outputs.is_release == 'true'
        env:
          # The token is scoped by the `permissions: contents: write` above.
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
          APK: ${{ steps.apk.outputs.path }}
          NAME: ${{ steps.apk.outputs.name }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists — uploading the APK to it."
            gh release upload "$TAG" "$APK#$NAME" --clobber
          else
            echo "No release for $TAG yet — creating it with the APK attached."
            gh release create "$TAG" "$APK#$NAME" \
              --title "ToolTrack AutoLab $TAG" \
              --generate-notes
          fi

          # Confirm the asset is actually listed, rather than trusting that the
          # upload command succeeded. This is the check whose absence let a
          # Release exist with nothing under Assets.
          if gh release view "$TAG" --json assets \
               --jq '.assets[].name' | grep -qx "$NAME"; then
            echo "Verified: $NAME is attached to release $TAG."
          else
            echo "The APK was not attached to release $TAG." >&2
            exit 1
          fi

      - name: Remove the keystore
        if: always()
        run: rm -rf "$RUNNER_TEMP/signing"
