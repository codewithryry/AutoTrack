name: Android release APK

# Builds the web app, wraps it with Capacitor, and produces a signed release APK.
#
# Nothing secret lives in this repository. The keystore arrives as a base64
# secret, is decoded to a file outside the workspace, and is removed again when
# the job ends. Every value that touches it is passed through the environment,
# never interpolated into a command line — an `${{ secrets.* }}` inside a `run:`
# would be substituted into the shell before it executes, and would then be
# visible in a trace or a crash message.

# A release is cut by pushing a version tag, not by pushing to main:
#
#   git tag 0.2.2 && git push origin 0.2.2      # or v0.2.2
#
# Both spellings are matched. `v*` alone would have missed the `0.2.1` tag that
# this repository actually uses, and a tag that matches no pattern does not fail
# — it simply never runs, which is how a Release came to exist with no APK
# attached to it.
#
# main and pull requests still build and sign, so breakage is found before a tag
# is cut — but they publish nothing. Only a version tag touches a Release.
on:
  push:
    branches: [main]
    tags:
      - '[0-9]+.[0-9]+.[0-9]+*'
      - 'v[0-9]+.[0-9]+.[0-9]+*'
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to build and attach the APK to (e.g. 0.2.5)'
        required: false
        type: string

# The Release step needs to write to the repository; nothing else does. Declared
# here so the job's token carries no more authority than the one step requires.
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          # Auto-generated release notes are written from the commits since the
          # previous tag, which the default shallow clone does not contain.
          fetch-depth: 0

      # Establishes, once, whether this run is a release and which version it is.
      #
      # The tag is the source of truth. A later step applies it to the project,
      # so `0.2.6` is the only thing anybody has to type in order to ship 0.2.6 —
      # no Android file, and no version in the source, has to be edited first.
      - name: Resolve the release version
        id: release
        env:
          # A tag given by hand, to attach an APK to a Release that already
          # exists without cutting a new tag for it.
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            tag="$GITHUB_REF_NAME"
          elif [ -n "$INPUT_TAG" ]; then
            tag="$INPUT_TAG"
            # A hand-typed tag has to exist, or the Release step would create an
            # empty one under a name nobody meant.
            if ! git rev-parse -q --verify "refs/tags/${tag}" >/dev/null; then
              echo "The tag ${tag} does not exist in this repository." >&2
              exit 1
            fi
          else
            tag=""
          fi

          if [ -n "$tag" ]; then
            # Both `0.2.6` and `v0.2.6` name the same release; the leading v is
            # not part of the version and is dropped here once, for everything
            # downstream.
            version="${tag#v}"

            # Android needs MAJOR.MINOR.PATCH to build a versionCode from. A tag
            # that cannot produce one is refused now rather than part-way through
            # the Gradle build.
            case "$version" in
              [0-9]*.[0-9]*.[0-9]*) ;;
              *)
                echo "The tag ${tag} is not a version Android can build from." >&2
                echo "Expected MAJOR.MINOR.PATCH, for example 0.2.6 or v0.2.6." >&2
                exit 1
                ;;
            esac

            echo "is_release=true" >> "$GITHUB_OUTPUT"
            echo "tag=${tag}" >> "$GITHUB_OUTPUT"
            echo "version=${version}" >> "$GITHUB_OUTPUT"
            echo "Building release ${tag} as version ${version}."
          else
            echo "is_release=false" >> "$GITHUB_OUTPUT"
            echo "Not a tag — building for verification only; nothing will be published."
          fi

      # Capacitor's CLI requires Node >= 22.
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      # Pinned to v3.2.2 and told exactly which packages to install.
      #
      # Left to itself the action resolves a default package set that still
      # includes `tools` — the obsolete SDK Tools bundle, which Google removed
      # from the repository. `sdkmanager` cannot find it and exits 1, which is
      # the failure this pins away from. `log-accepted-android-sdk-licenses` is
      # off so the licence hashes stay out of the build log.
      - uses: android-actions/setup-android@v3.2.2
        with:
          packages: ""
          log-accepted-android-sdk-licenses: false

      # Only what this project actually builds against, read from the Gradle
      # configuration rather than assumed:
      #   • compileSdk/targetSdk 36 → android/variables.gradle
      #   • build-tools 36.0.0      → the version AGP 8.13.0 defaults to
      #   • platform-tools          → adb and friends, needed by the toolchain
      # `--sdk_root` keeps the packages in the SDK the action just provisioned.
      - name: Install the Android SDK packages
        run: |
          sdkmanager --sdk_root="$ANDROID_SDK_ROOT" \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0"

      - name: Install dependencies
        run: npm ci

      # Writes the tag's version into the project, before anything reads it.
      #
      # `package.json` is what `android/app/build.gradle` parses for
      # `versionName` and packs into `versionCode`, and `APP_VERSION` in
      # `src/utils/constants.js` is what Settings → About and the loading screen
      # show. Setting both here is what makes tagging 0.2.6 enough on its own:
      # no Android file holds a version, and none has to be edited to ship one.
      #
      # The edit stays in the runner's workspace and is never committed. The tag
      # is already the record of the version; a commit saying the same thing
      # would only be a second place for it to drift.
      #
      # Skipped entirely on a push to main, which has no release version — that
      # build reports whatever the branch already says.
      - name: Apply the release version
        if: steps.release.outputs.is_release == 'true'
        run: |
          node scripts/set-version.mjs "${{ steps.release.outputs.version }}"

          # Prove it took, from the files themselves rather than from the script
          # that just wrote them.
          node scripts/set-version.mjs "${{ steps.release.outputs.version }}" --check

      - name: Build the web app for the native shell
        env:
          # Every client-side variable the application actually reads, and
          # nothing else. All four are compiled into the bundle, so all four are
          # public by definition — an APK can be unzipped. That is fine for what
          # is here and is why the server-only values are absent:
          # COHERE_API_KEY, VAPID_PRIVATE_KEY, VAPID_SUBJECT and
          # SUPABASE_SERVICE_ROLE_KEY belong to `api/*` on the deployment and
          # must never be given a VITE_ name or reach this build.
          #
          # Required — src/supabase/config.js throws without them. The
          # publishable (anon) key authorises nothing on its own; Row Level
          # Security is what protects the data.
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
          # Optional — the public half of the VAPID pair, read by
          # src/services/push.js. Unset, `isAvailable()` is false and the app
          # simply runs without push, so a missing secret must not fail the
          # build. The private half (VAPID_PRIVATE_KEY) stays on the server.
          #
          # `||` supplies an empty string when the secret does not exist, which
          # is also what stops an editor warning on a repository that has not
          # defined it. Set the secret to switch push on in the APK:
          #   gh secret set VITE_VAPID_PUBLIC_KEY --repo codewithryry/AutoTrack
          # VITE_VAPID_PUBLIC_KEY: ${{ secrets.VITE_VAPID_PUBLIC_KEY || '' }}
          # Where the deployed web app lives, so the APK can reach the app's own
          # /api/* endpoints — in the WebView a relative path would resolve
          # against the shell's own origin, which serves nothing. A fixed
          # deployment address rather than a repository variable: it is not a
          # secret, and a missing variable would silently produce an APK whose
          # /api/* calls go nowhere.
          VITE_PUBLIC_APP_URL: https://autotracking.vercel.app
          #
          # VITE_SIGNUP_EMAIL_DOMAINS is deliberately not set here. It is an
          # optional allowlist and is empty in .env; unset, sign-up accepts any
          # address, which is the behaviour this project runs with. Leaving it
          # out keeps the build from depending on a repository variable that
          # does not need to exist.
        run: npm run build:android

      - name: Sync the native project
        run: npx cap sync android

      - name: Decode the keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "ANDROID_KEYSTORE_BASE64 is not set — cannot produce a signed APK." >&2
            exit 1
          fi
          # Outside the workspace, so it can never be picked up by a later step
          # that archives or uploads the checkout.
          mkdir -p "$RUNNER_TEMP/signing"
          # `tr -d` strips the whitespace and newlines the GitHub secrets box
          # adds to a pasted value; without it `base64 -d` can refuse the input
          # or write a truncated keystore. The keystore is binary and is never
          # echoed.
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | tr -d '\r\n \t' | base64 -d > "$RUNNER_TEMP/signing/release.jks"

          if [ ! -s "$RUNNER_TEMP/signing/release.jks" ]; then
            echo "The decoded keystore is empty — ANDROID_KEYSTORE_BASE64 is not valid base64." >&2
            exit 1
          fi
          echo "Keystore decoded ($(stat -c%s "$RUNNER_TEMP/signing/release.jks") bytes)."

      # Checks the shape of the credentials before Gradle gets them, so a bad
      # secret is reported in one clear line instead of surfacing as
      # "Get Key failed: getSecretKey failed: Password is not ASCII" from deep
      # inside :app:packageRelease.
      #
      # Nothing here prints a value: only lengths, yes/no answers and the name of
      # the offending variable reach the log.
      - name: Validate the signing credentials
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          fail=0

          check() {
            name="$1"
            value="$2"

            if [ -z "$value" ]; then
              echo "FAIL  $name is empty or not set."
              fail=1
              return
            fi

            # Raw byte length against the length with CR/LF/tab removed. A
            # mismatch is the usual cause of this failure: a value pasted into
            # the secrets box with a trailing newline.
            raw=$(printf '%s' "$value" | wc -c)
            trimmed=$(printf '%s' "$value" | tr -d '\r\n\t' | wc -c)
            if [ "$raw" -ne "$trimmed" ]; then
              echo "FAIL  $name contains a line break or tab."
              echo "      Re-enter the secret with no trailing newline."
              fail=1
              return
            fi

            if printf '%s' "$value" | grep -qE '^[[:space:]]|[[:space:]]$'; then
              echo "FAIL  $name has leading or trailing whitespace."
              fail=1
              return
            fi

            # The actual error being fixed: Java's keystore loader accepts ASCII
            # only. This catches smart quotes pasted from a document, accented
            # characters, and any other non-ASCII byte.
            if LC_ALL=C printf '%s' "$value" | grep -q '[^ -~]'; then
              echo "FAIL  $name contains a non-ASCII or control character."
              echo "      Retype it by hand rather than pasting from a document."
              fail=1
              return
            fi

            # A password that is really the base64 keystore in the wrong box. The
            # keystore is thousands of characters, so length alone is a reliable
            # and non-revealing signal.
            if [ "$raw" -gt 256 ]; then
              echo "FAIL  $name is too long for a password or alias."
              echo "      Check it is not the ANDROID_KEYSTORE_BASE64 value."
              fail=1
              return
            fi

            echo "ok    $name is present and ASCII."
          }

          check ANDROID_KEYSTORE_PASSWORD "$ANDROID_KEYSTORE_PASSWORD"
          check ANDROID_KEY_ALIAS         "$ANDROID_KEY_ALIAS"
          check ANDROID_KEY_PASSWORD      "$ANDROID_KEY_PASSWORD"

          if [ "$fail" -ne 0 ]; then
            echo "" >&2
            echo "One or more signing secrets are malformed. Fix them under" >&2
            echo "Settings -> Secrets and variables -> Actions, then re-run." >&2
            exit 1
          fi
          echo "All signing credentials are well-formed."

      # Proves the keystore, its password and the alias actually agree, before a
      # full Gradle build is spent finding out. `keytool -list` exits non-zero on
      # a wrong password or a missing alias; its output is discarded so no
      # certificate detail reaches the log.
      - name: Verify the keystore opens with these credentials
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          if keytool -list \
              -keystore "$RUNNER_TEMP/signing/release.jks" \
              -storepass "$ANDROID_KEYSTORE_PASSWORD" \
              -alias "$ANDROID_KEY_ALIAS" >/dev/null 2>&1; then
            echo "The keystore opens and contains the expected alias."
          else
            echo "The keystore could not be opened with ANDROID_KEYSTORE_PASSWORD," >&2
            echo "or it does not contain the alias named by ANDROID_KEY_ALIAS." >&2
            echo "This keystore was generated with the alias 'android'." >&2
            exit 1
          fi

      - name: Build the signed release APK
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/signing/release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        working-directory: android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Verify the APK is signed
        run: |
          APK=android/app/build/outputs/apk/release/app-release.apk
          if [ ! -f "$APK" ]; then
            echo "No APK was produced at $APK" >&2
            exit 1
          fi

          # apksigner ships with the build-tools; find the newest copy.
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1)"
          if [ -z "$APKSIGNER" ]; then
            echo "apksigner was not found in the Android SDK." >&2
            exit 1
          fi

          # The real check: this fails the job on an unsigned or badly signed APK
          # rather than shipping one. `--verbose` prints the scheme versions and
          # the certificate digests, none of which are secret.
          "$APKSIGNER" verify --verbose --print-certs "$APK"
          echo "APK signature verified."

      # Where each merged permission came from.
      #
      # The manifest merger records, line by line, which library contributed
      # every element it folded in. Printing it turns "the APK asks for
      # something unexpected" into "this dependency added it", which is the one
      # piece of information needed to decide whether a permission is legitimate
      # or wants removing at source.
      #
      # Informational: it never fails the build. The step below is the gate.
      - name: Show where each merged permission came from
        if: always()
        run: |
          REPORT=android/app/build/outputs/logs/manifest-merger-release-report.txt
          if [ ! -f "$REPORT" ]; then
            echo "No merger report at $REPORT — skipping."
            exit 0
          fi

          echo "Permissions in the merged manifest, with the library that added each:"
          echo ""
          # A `uses-permission#<name>` line opens a block; the ADDED / MERGED /
          # IMPLIED lines under it name the manifest each contribution came from.
          # Those provenance lines start at column 0 in the real report, so the
          # block ends at the next element rather than at the next unindented
          # line. Attribute lines (indented, tab-led) are skipped: they describe
          # the XML attributes, not the source.
          awk '
            /^uses-permission#/ {
              name = $0
              sub(/^uses-permission#/, "", name)
              print "  " name
              inperm = 1
              next
            }
            /^(ADDED|MERGED|IMPLIED|REJECTED) from/ {
              if (inperm) {
                line = $0
                sub(/:[0-9]+:[0-9]+-[0-9]+$/, "", line)   # drop line:col noise
                print "      " line
              }
              next
            }
            /^[[:space:]]/ { next }                        # attribute detail
            /^[a-zA-Z]/ { inperm = 0 }                     # a different element
          ' "$REPORT"

      - name: Upload the manifest merger report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: manifest-merger-report
          path: android/app/build/outputs/logs/manifest-merger-release-report.txt
          if-no-files-found: ignore

      # What the APK actually asks the device for, read back out of the built
      # APK rather than from the manifest source - the manifest merger folds in
      # every library's manifest, so the source file is not the final answer.
      #
      # The list is pinned: a plugin update that starts merging in a new
      # permission fails the build here instead of being discovered by a user
      # seeing a Play Protect warning. To add one deliberately, add it to
      # EXPECTED below and say why in the app manifest.
      - name: Verify the APK requests only the expected permissions
        run: |
          APK=android/app/build/outputs/apk/release/app-release.apk
          AAPT="$(find "$ANDROID_HOME/build-tools" -name aapt2 -type f | sort -V | tail -1)"

          # Asked for by this app, in its own manifest, each backed by a feature:
          #   ACCESS_FINE_LOCATION / ACCESS_COARSE_LOCATION
          #     one-shot fix recorded with a borrow or return (utils/geo.js)
          #   CAMERA          the QR scanner
          #   INTERNET        Supabase, and the app's own /api/* endpoints
          #   POST_NOTIFICATIONS  Android 13+ runtime permission for the alerts
          #                       services/nativeNotifications.js posts
          #
          # Merged in by a library, kept deliberately — neither can be removed
          # without breaking the thing that declares it, and neither is a
          # privacy-relevant grant:
          #
          #   ACCESS_NETWORK_STATE
          #     Normal protection level: granted at install, never prompts, and
          #     shows in no permission screen. It reads whether a network is up —
          #     not its traffic — which is what a WebView stack checks before
          #     loading, and what the offline mode in this app depends on being
          #     able to answer. Declared by a library in the Capacitor/AndroidX
          #     stack; the merger report printed by the step above names which.
          #
          #   ph.edu.autolab.tooltrack.DYNAMIC_RECEIVER_NOT_EXPORTED_PERMISSION
          #     Declared by androidx.core (1.17.0) — verified in its own
          #     AndroidManifest.xml, where it is defined with
          #     protectionLevel="signature" and immediately requested.
          #     It is this app's OWN permission, namespaced under its
          #     application id, and signature-level means only code signed with
          #     the same key can hold it: no other app can. androidx.core uses it
          #     to register runtime receivers as not-exported on Android 13+,
          #     which is a hardening measure — removing it would make
          #     ContextCompat.registerReceiver throw at runtime.
          cat > /tmp/expected-permissions <<'PERMS'
          android.permission.ACCESS_COARSE_LOCATION
          android.permission.ACCESS_FINE_LOCATION
          android.permission.ACCESS_NETWORK_STATE
          android.permission.CAMERA
          android.permission.INTERNET
          android.permission.POST_NOTIFICATIONS
          ph.edu.autolab.tooltrack.DYNAMIC_RECEIVER_NOT_EXPORTED_PERMISSION
          PERMS
          sed -i 's/^[[:space:]]*//' /tmp/expected-permissions
          sort -u -o /tmp/expected-permissions /tmp/expected-permissions

          "$AAPT" dump permissions "$APK" \
            | sed -n "s/^uses-permission: name='\([^']*\)'.*/\1/p" \
            | sort -u > /tmp/actual-permissions

          echo "Permissions in the APK:"
          sed 's/^/  /' /tmp/actual-permissions

          if ! diff /tmp/expected-permissions /tmp/actual-permissions >/dev/null; then
            echo "" >&2
            echo "The APK's permissions differ from the expected set." >&2
            diff /tmp/expected-permissions /tmp/actual-permissions >&2 || true
            echo "" >&2
            echo "A line marked > is newly requested; a line marked < was" >&2
            echo "expected but is gone." >&2
            echo "" >&2
            echo "Do not reach for tools:node=\"remove\" first. Read the merger" >&2
            echo "report printed above (and uploaded as an artifact) to see which" >&2
            echo "library added it, then decide:" >&2
            echo "  • a library needs it to work  -> add it to the list here," >&2
            echo "    with a line saying which library and why" >&2
            echo "  • our own config asked for it and nothing uses it" >&2
            echo "    -> remove it at the source that declared it" >&2
            exit 1
          fi
          echo "Permissions match the expected set."

      # A release APK must never be debuggable: it opens the running app to any
      # process on the device, and it is one of the things a scanner looks at.
      - name: Verify the APK is a release build
        run: |
          APK=android/app/build/outputs/apk/release/app-release.apk
          AAPT="$(find "$ANDROID_HOME/build-tools" -name aapt2 -type f | sort -V | tail -1)"
          if "$AAPT" dump badging "$APK" | grep -q "application-debuggable"; then
            echo "This APK is debuggable - refusing to publish it." >&2
            exit 1
          fi
          echo "Not debuggable."

      # The APK must call itself what the tag called it.
      #
      # Read back out of the built APK, not from the files that fed it: this is
      # the only check that proves the whole chain — tag, package.json, Gradle —
      # actually arrived at the version somebody will see in Android's app info
      # and in Settings → About.
      - name: Verify the APK reports the release version
        if: steps.release.outputs.is_release == 'true'
        env:
          EXPECTED: ${{ steps.release.outputs.version }}
        run: |
          APK=android/app/build/outputs/apk/release/app-release.apk
          AAPT="$(find "$ANDROID_HOME/build-tools" -name aapt2 -type f | sort -V | tail -1)"

          badging="$("$AAPT" dump badging "$APK")"
          name="$(printf '%s' "$badging" | sed -n "s/.*versionName='\([^']*\)'.*/\1/p")"
          code="$(printf '%s' "$badging" | sed -n "s/.*versionCode='\([^']*\)'.*/\1/p")"

          echo "APK versionName: ${name}"
          echo "APK versionCode: ${code}"

          if [ "$name" != "$EXPECTED" ]; then
            echo "" >&2
            echo "The APK reports ${name}, but the tag asked for ${EXPECTED}." >&2
            exit 1
          fi

          # A versionCode of 0 or empty would install once and then refuse every
          # later build as a downgrade.
          if [ -z "$code" ] || [ "$code" -le 0 ]; then
            echo "The APK has no usable versionCode (${code})." >&2
            exit 1
          fi

          # And the About screen, which reads APP_VERSION rather than the APK.
          node scripts/set-version.mjs "$EXPECTED" --check

          echo "The APK reports ${EXPECTED} (versionCode ${code})."

      # Named for the build it came from, so a downloaded APK is identifiable
      # rather than being one more `app-release.apk` in a downloads folder.
      - name: Name the APK
        id: apk
        run: |
          if [ "${{ steps.release.outputs.is_release }}" = "true" ]; then
            name="tooltrack-${{ steps.release.outputs.tag }}.apk"
          else
            name="tooltrack-${GITHUB_SHA:0:7}.apk"
          fi
          cp android/app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/$name"
          echo "path=$RUNNER_TEMP/$name" >> "$GITHUB_OUTPUT"
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "Prepared $name"

      # Every run keeps the APK as a build artifact, tagged or not — that is what
      # makes a main-branch run useful without publishing anything.
      - name: Upload the APK as a build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.apk.outputs.name }}
          path: ${{ steps.apk.outputs.path }}
          if-no-files-found: error

      # Attaches the signed APK to the Release for this tag, creating that
      # Release only if it does not already exist.
      #
      # A push to main reaches this step and skips it, so main is still verified
      # end to end without ever touching a Release.
      #
      # `gh` rather than a third-party action, because the requirement is
      # precisely "upload to the release that is already there": `gh release
      # view` answers whether it exists, `gh release upload --clobber` adds or
      # replaces the asset without disturbing the notes somebody may have
      # written, and `gh release create` is reached only for a tag that has no
      # Release yet. No duplicate Release is possible.
      - name: Attach the APK to the GitHub Release
        if: steps.release.outputs.is_release == 'true'
        env:
          # The token is scoped by the `permissions: contents: write` above.
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
          APK: ${{ steps.apk.outputs.path }}
          NAME: ${{ steps.apk.outputs.name }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists — uploading the APK to it."
            gh release upload "$TAG" "$APK#$NAME" --clobber
          else
            echo "No release for $TAG yet — creating it with the APK attached."
            gh release create "$TAG" "$APK#$NAME" \
              --title "ToolTrack AutoLab $TAG" \
              --generate-notes
          fi

          # Confirm the asset is actually listed, rather than trusting that the
          # upload command succeeded. This is the check whose absence let a
          # Release exist with nothing under Assets.
          if gh release view "$TAG" --json assets \
               --jq '.assets[].name' | grep -qx "$NAME"; then
            echo "Verified: $NAME is attached to release $TAG."
          else
            echo "The APK was not attached to release $TAG." >&2
            exit 1
          fi

      # Keeps the README's plain-text version line in step with the release.
      #
      # The badge beside it already reads the latest release live, so the page a
      # visitor sees is correct the moment the release is published — this is for
      # the text under it, which is what shows in raw markdown and with images
      # blocked. Only the bytes between the latest-version markers are rewritten.
      #
      # Runs last, and only after the APK is genuinely attached: a README that
      # advertises a version whose download failed would be worse than one a
      # release behind.
      #
      # No infinite loop is possible, by three separate mechanisms:
      #
      #   1. This workflow triggers on `push` to main and on tags. The commit
      #      below is pushed to main, so at most it could start ONE more run —
      #      and that run is not a tag build, so `is_release` is false and this
      #      step is skipped. The chain stops after one hop even if 2 and 3 fail.
      #   2. `[skip ci]` in the message, which GitHub honours by not starting a
      #      run for that commit at all.
      #   3. The push is skipped entirely when the README already says the right
      #      version, so a re-run of the same release commits nothing.
      - name: Update the README's latest version
        if: steps.release.outputs.is_release == 'true'
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          # Nothing to do if it already says the right thing. This is what makes
          # re-running a release a no-op rather than an empty commit.
          if node scripts/update-readme-version.mjs "$VERSION" --check; then
            echo "The README already says ${VERSION}; nothing to push."
            exit 0
          fi

          node scripts/update-readme-version.mjs "$VERSION"

          if git diff --quiet -- README.md; then
            echo "No change to README.md after the rewrite; nothing to push."
            exit 0
          fi

          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # The tag build is checked out at the tag, which is a detached HEAD —
          # committing here would leave the change on no branch at all. The
          # single changed file is carried onto a fresh checkout of main instead.
          README_BODY="$(cat README.md)"
          git stash push --quiet -- README.md 2>/dev/null || true
          git fetch --quiet origin main
          git checkout --quiet -B readme-update origin/main
          printf '%s\n' "$README_BODY" > README.md

          # main may already carry this version — someone could have edited it by
          # hand, or an earlier run pushed it.
          if git diff --quiet -- README.md; then
            echo "main already says ${VERSION}; nothing to push."
            exit 0
          fi

          git add README.md
          git commit -m "docs: latest version ${VERSION} [skip ci]"

          # A plain push, not a force: if main moved while this built, the push
          # is rejected and the release still stands. The README is one release
          # behind until the next one, which is a cosmetic lag rather than a
          # reason to overwrite somebody's commit.
          if git push origin readme-update:main; then
            echo "README updated to ${VERSION} on main."
          else
            echo "::warning::main moved while this built, so the README was not" \
                 "updated to ${VERSION}. Re-run this workflow, or edit the line by hand."
          fi

      - name: Remove the keystore
        if: always()
        run: rm -rf "$RUNNER_TEMP/signing"
