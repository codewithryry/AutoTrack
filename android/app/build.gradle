apply plugin: 'com.android.application'

/*
 * The app version, read from package.json rather than written here.
 *
 * These two lines used to say 1.0 while the project was on 0.2.x, so the APK
 * reported a version the project had never used: "Version 0.2.5" in Settings
 * and 1.0 in Android's own app info. The release workflow already refuses a tag
 * that disagrees with package.json, so package.json is the one place a version
 * is set and this follows it.
 *
 * Parsed with a regex rather than a JSON library because a Gradle script has no
 * dependency on one: the first top-level "version" key is the project's own,
 * since npm writes it in the opening object.
 *
 * versionCode must be a single integer that only ever increases, so the three
 * parts are packed as major*10000 + minor*100 + patch — 0.2.5 becomes 205, and
 * a later 0.3.0 becomes 300. Two digits per part, which is what keeps the
 * ordering right without a build-number file to maintain.
 *
 * Only the numeric parts are taken, and missing ones read as zero: a two-part
 * "1.0" and a pre-release "0.3.0-beta.1" both parse rather than failing the
 * build on a version string nobody thought to test. The previous hard-coded
 * versionCode was 1, so 205 is an increase and an installed APK upgrades
 * rather than being refused as a downgrade.
 */
def packageJson = new File(rootDir, '../package.json').text
def appVersionName = (packageJson =~ /"version"\s*:\s*"([^"]+)"/)[0][1]
def appVersionParts = (appVersionName.tokenize('.-').findAll { it.isInteger() } + ['0', '0', '0'])
def appVersionCode = appVersionParts[0].toInteger() * 10000 +
                     appVersionParts[1].toInteger() * 100 +
                     appVersionParts[2].toInteger()

android {
    namespace = "ph.edu.autolab.tooltrack"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "ph.edu.autolab.tooltrack"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode appVersionCode
        versionName appVersionName
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    /*
     * Release signing, from the environment only.
     *
     * No keystore, password or alias is stored in this repository or in any
     * committed Gradle file. CI writes the keystore to a path outside the repo,
     * exports the four values below, and this block picks them up. A local build
     * without them still works: the release variant is simply left unsigned
     * rather than failing the build, which is what keeps `assembleDebug` and a
     * developer's own release build usable.
     */
    signingConfigs {
        release {
            def storePath = System.getenv("ANDROID_KEYSTORE_PATH")
            if (storePath) {
                // Surrounding whitespace is stripped from every credential.
                //
                // A secret pasted into the GitHub secrets box very often carries
                // a trailing newline, and Java's keystore loader rejects that
                // byte with "Password is not ASCII" from inside packageRelease —
                // an error that names neither the variable nor the character.
                // Trimming here is what makes a correct password with an
                // invisible newline behave as the password it is meant to be.
                //
                // Only the edges are touched: a password with a space inside it
                // is left exactly as typed.
                def env = { name -> System.getenv(name)?.trim() }

                storeFile file(storePath)
                storePassword env("ANDROID_KEYSTORE_PASSWORD")
                keyAlias env("ANDROID_KEY_ALIAS")
                keyPassword env("ANDROID_KEY_PASSWORD")
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            if (System.getenv("ANDROID_KEYSTORE_PATH")) {
                signingConfig signingConfigs.release
            }
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
